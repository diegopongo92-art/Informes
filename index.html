<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Plataforma de Análisis y Reportes Mensuales</title>
  
  <!-- Librerías externas: PapaParse para CSV y Chart.js para gráficos -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    :root {
      --bg-color: #f4f6f9;
      --card-bg: #ffffff;
      --primary: #2563eb;
      --text-dark: #1e293b;
      --text-muted: #64748b;
      --border: #e2e8f0;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-dark);
      margin: 0;
      padding: 20px;
    }

    .dashboard-container {
      max-width: 1200px;
      margin: 0 auto;
    }

    .header-panel {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--card-bg);
      padding: 20px 25px;
      border-radius: 12px;
      box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
      margin-bottom: 20px;
    }

    .header-panel h1 {
      margin: 0;
      font-size: 22px;
    }

    .filter-group {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    select {
      padding: 8px 16px;
      border-radius: 6px;
      border: 1px solid var(--border);
      font-size: 14px;
      outline: none;
      background: #fff;
    }

    /* Grid de tarjetas KPI */
    .kpi-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 20px;
      margin-bottom: 20px;
    }

    .kpi-card {
      background: var(--card-bg);
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
      border-left: 4px solid var(--primary);
    }

    .kpi-title {
      font-size: 12px;
      text-transform: uppercase;
      color: var(--text-muted);
      font-weight: 600;
      letter-spacing: 0.5px;
    }

    .kpi-value {
      font-size: 26px;
      font-weight: 700;
      margin-top: 8px;
    }

    /* Sección de Análisis Gráfico y Tabla */
    .analytics-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 20px;
    }

    .panel {
      background: var(--card-bg);
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
    }

    .table-responsive {
      overflow-x: auto;
      max-height: 400px;
      overflow-y: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 14px;
    }

    th, td {
      padding: 12px;
      text-align: left;
      border-bottom: 1px solid var(--border);
    }

    th {
      background-color: #f8fafc;
      position: sticky;
      top: 0;
      font-weight: 600;
    }

    #loader {
      text-align: center;
      padding: 40px;
      font-size: 16px;
      color: var(--text-muted);
    }
  </style>
</head>
<body>

<div class="dashboard-container">
  
  <!-- Encabezado con selector de mes -->
  <div class="header-panel">
    <h1>Plataforma de Análisis Mensual</h1>
    <div class="filter-group">
      <label for="mesSelector"><strong>Filtrar Reporte:</strong></label>
      <select id="mesSelector" onchange="filtrarReporte()">
        <option value="TODOS">Todos los registros</option>
      </select>
    </div>
  </div>

  <div id="loader">Cargando y analizando base de datos en tiempo real...</div>

  <div id="dashboard-content" style="display: none;">
    
    <!-- Tarjetas de Métricas (KPIs) -->
    <div class="kpi-grid">
      <div class="kpi-card">
        <div class="kpi-title">Total de Registros</div>
        <div class="kpi-value" id="kpi-registros">0</div>
      </div>
      <div class="kpi-card">
        <div class="kpi-title">Suma Total / Métrica Principal</div>
        <div class="kpi-value" id="kpi-suma">0</div>
      </div>
      <div class="kpi-card">
        <div class="kpi-title">Promedio General</div>
        <div class="kpi-value" id="kpi-promedio">0</div>
      </div>
    </div>

    <div class="analytics-grid">
      <!-- Gráfico interactivo -->
      <div class="panel">
        <canvas id="graficoAnalisis" height="100"></canvas>
      </div>

      <!-- Tabla detallada -->
      <div class="panel">
        <strong>Detalle del Reporte</strong>
        <div class="table-responsive" style="margin-top: 15px;">
          <table>
            <thead id="tabla-headers"></thead>
            <tbody id="tabla-body"></tbody>
          </table>
        </div>
      </div>
    </div>

  </div>
</div>

<script>
  const csv_url = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vT2khLH7C3lCFCIV3ss1U5AV4SOL922Sld2rnPhSayp39VqgtlBV8ey63dxgCbur1nHiK-6CfNKB2B-/pub?gid=817460174&single=true&output=csv';
  
  let datosGlobales = [];
  let miGrafico = null;

  // Carga e inicialización de datos
  Papa.parse(csv_url, {
    download: true,
    header: true,
    skipEmptyLines: true,
    complete: function(resultado) {
      datosGlobales = resultado.data;
      document.getElementById('loader').style.display = 'none';
      document.getElementById('dashboard-content').style.display = 'block';
      
      poblarFiltroMeses();
      procesarDatos('TODOS');
    },
    error: function(err) {
      document.getElementById('loader').innerText = 'Error al conectar con la base de datos de Google Sheets.';
    }
  });

  // Identifica columnas numéricas y fechas/meses dinámicamente
  function poblarFiltroMeses() {
    const selector = document.getElementById('mesSelector');
    const valoresMes = new Set();

    datosGlobales.forEach(row => {
      Object.keys(row).forEach(key => {
        const val = String(row[key]).trim();
        // Detectar si alguna celda menciona meses
        if (val.match(/enero|febrero|marzo|abril|mayo|junio|julio|agosto|septiembre|octubre|noviembre|diciembre/i)) {
          valoresMes.add(val);
        }
      });
    });

    valoresMes.forEach(mes => {
      const option = document.createElement('option');
      option.value = mes;
      option.textContent = mes;
      selector.appendChild(option);
    });
  }

  function filtrarReporte() {
    const mesSeleccionado = document.getElementById('mesSelector').value;
    procesarDatos(mesSeleccionado);
  }

  function procesarDatos(filtro) {
    let datosFiltrados = datosGlobales;

    if (filtro !== 'TODOS') {
      datosFiltrados = datosGlobales.filter(row => 
        Object.values(row).some(val => String(val).trim().toLowerCase() === filtro.toLowerCase())
      );
    }

    // Calcular Métricas (KPIs)
    let sumaTotal = 0;
    let contadorNumeros = 0;

    datosFiltrados.forEach(row => {
      Object.values(row).forEach(val => {
        const num = parseFloat(String(val).replace(/[^0-9.-]+/g, ""));
        if (!isNaN(num) && num < 10000000) { // Filtrar valores no numéricos o IDs gigantes
          sumaTotal += num;
          contadorNumeros++;
        }
      });
    });

    document.getElementById('kpi-registros').innerText = datosFiltrados.length;
    document.getElementById('kpi-suma').innerText = sumaTotal.toLocaleString('es-ES', { maximumFractionDigits: 2 });
    document.getElementById('kpi-promedio').innerText = contadorNumeros > 0 
      ? (sumaTotal / contadorNumeros).toLocaleString('es-ES', { maximumFractionDigits: 2 }) 
      : 0;

    renderizarTabla(datosFiltrados);
    renderizarGrafico(datosFiltrados);
  }

  function renderizarTabla(datos) {
    const headers = document.getElementById('tabla-headers');
    const body = document.getElementById('tabla-body');

    if (datos.length === 0) {
      headers.innerHTML = '';
      body.innerHTML = '<tr><td colspan="5">No hay registros para mostrar.</td></tr>';
      return;
    }

    const columnas = Object.keys(datos[0]);
    headers.innerHTML = '<tr>' + columnas.map(c => `<th>${c}</th>`).join('') + '</tr>';

    body.innerHTML = datos.map(row => {
      return '<tr>' + columnas.map(c => `<td>${row[c] || ''}</td>`).join('') + '</tr>';
    }).join('');
  }

  function renderizarGrafico(datos) {
    const ctx = document.getElementById('graficoAnalisis').getContext('2d');
    
    if (miGrafico) miGrafico.destroy();

    if (datos.length === 0) return;

    const columnas = Object.keys(datos[0]);
    const etiquetaEjeX = columnas[0]; // Usa la primera columna como eje X
    const columnaMetrica = columnas.find(c => c !== etiquetaEjeX) || columnas[0];

    const labels = datos.map(d => d[etiquetaEjeX]);
    const valores = datos.map(d => {
      const v = parseFloat(String(d[columnaMetrica]).replace(/[^0-9.-]+/g, ""));
      return isNaN(v) ? 0 : v;
    });

    miGrafico = new Chart(ctx, {
      type: 'bar',
      data: {
        labels: labels,
        datasets: [{
          label: columnaMetrica,
          data: valores,
          backgroundColor: 'rgba(37, 99, 235, 0.6)',
          borderColor: 'rgba(37, 99, 235, 1)',
          borderWidth: 1
        }]
      },
      options: {
        responsive: true,
        plugins: {
          legend: { position: 'top' },
          title: { display: true, text: 'Análisis Visual de Datos' }
        }
      }
    });
  }
</script>

</body>
</html>
